---
name: test

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    env:
      TERM: xterm
      # Dummy values for required env vars (only enforced on real systems)
      EMAIL: ci@localhost
      GIT_AUTHOR_NAME: CI
      GIT_COMMITTER_NAME: CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_EMAIL: ci@localhost
      NPM_CONFIG_INIT_AUTHOR_NAME: CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: dev

      - name: Provision dotfiles (including mise.toml)
        run: ./bootstrap/symlink

      # mise might use pipx, and yamllint certainly needs it
      - name: Install pipx via Brew
        if: matrix.os == 'macos-latest'
        run: brew install pipx && pipx ensurepath

      - name: Install mise and tools including neovim and nodejs
        id: mise-install
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea  # v4.2.1
        continue-on-error: true

      - name: Retry mise install on transient failure
        if: steps.mise-install.outcome == 'failure'
        run: mise install

      - name: Run tests
        run: mise run test
