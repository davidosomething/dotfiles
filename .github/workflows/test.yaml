---
name: test

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    env:
      TERM: xterm

    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: dev

      - name: Provision dotfiles (including mise.toml)
        run: ./bootstrap/symlink

      # mise might use pipx, and yamllint certainly needs it
      - name: Install pipx via Brew
        if: matrix.os == 'macos-latest'
        run: brew install pipx && pipx ensurepath

      - name: Install mise and tools including neovim and nodejs
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0

      - name: Run tests
        run: mise run test
