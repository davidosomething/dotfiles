---
name: test

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    env:
      TERM: xterm
      # Dummy values for required env vars (only enforced on real systems)
      EMAIL: ci@localhost
      GIT_AUTHOR_NAME: CI
      GIT_COMMITTER_NAME: CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_EMAIL: ci@localhost
      NPM_CONFIG_INIT_AUTHOR_NAME: CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Provision dotfiles (including mise.toml)
        run: ./bootstrap/symlink

      # mise might use pipx, and yamllint certainly needs it
      - name: Install pipx via Brew
        if: matrix.os == 'macos-latest'
        run: brew install pipx && pipx ensurepath

      - name: Install mise and tools including neovim and nodejs
        id: mise-install
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        continue-on-error: true

      - name: Retry mise install on transient failure
        if: steps.mise-install.outcome == 'failure'
        run: mise install

      - name: Run tests
        # Prepend shims so mise run's child PATH rebuild puts mise-managed paths
        # first; on macOS the action exports a stale rust-proxies entry (External
        # rust provider flips to Managed after `mise install`) that otherwise
        # lands ahead of the tool paths and trips `mise doctor`.
        run: PATH="$HOME/.local/share/mise/shims:$PATH" mise run test

  release:
    needs: [test]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
