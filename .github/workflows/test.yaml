---
name: test

on:
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]

    env:
      TERM: xterm
      # Dummy values for required env vars (only enforced on real systems)
      EMAIL: ci@localhost
      GIT_AUTHOR_NAME: CI
      GIT_COMMITTER_NAME: CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_EMAIL: ci@localhost
      NPM_CONFIG_INIT_AUTHOR_NAME: CI

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Provision dotfiles (including mise.toml)
        run: ./bootstrap/symlink

      # mise might use pipx, and yamllint certainly needs it
      - name: Install pipx via Brew
        if: matrix.os == 'macos-latest'
        run: brew install pipx && pipx ensurepath

      - name: Install mise and tools including neovim and nodejs
        id: mise-install
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        continue-on-error: true

      - name: Retry mise install on transient failure
        if: steps.mise-install.outcome == 'failure'
        run: mise install

      - name: Run tests
        run: mise run test

  release:
    needs: [test]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
